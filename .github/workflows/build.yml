name: Build And Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: electrical-calculations-pro-release
  cancel-in-progress: false

jobs:

  release:

    name: Build Signed Release

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Verify Release Signing Secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing GitHub Secret: KEYSTORE_BASE64"
            missing=1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing GitHub Secret: KEYSTORE_PASSWORD"
            missing=1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing GitHub Secret: KEY_ALIAS"
            missing=1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing GitHub Secret: KEY_PASSWORD"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "::error::Permanent release signing is not configured."
            echo "::error::The build was intentionally stopped."
            exit 1
          fi

          echo "All release signing secrets are present."

      - name: Set Build Version
        shell: bash
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          gradle \
            :app:assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Verify APK Exists
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Verify APK Signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

      - name: Verify APK Package
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$APK" \
            | grep "package: name='com.electrical.calculationspro'"

      - name: Rename APK
        shell: bash
        run: |
          cp \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/ElectricalCalculationsPro-release.apk

      - name: Calculate APK SHA256
        shell: bash
        run: |
          sha256sum \
            app/build/outputs/apk/release/ElectricalCalculationsPro-release.apk \
            > apk-sha256.txt

          cat apk-sha256.txt

      - name: Create Release Notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          # Electrical Calculations Pro

          Version: 1.0.${{ github.run_number }}

          Version Code: ${{ github.run_number }}

          Commit:
          ${{ github.sha }}

          This release was automatically built and signed.

          The APK is intended to update the existing
          Electrical Calculations Pro installation without
          removing the application or its stored data.

          ## APK SHA-256

          $(cat apk-sha256.txt)
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v1.0.${{ github.run_number }}"

          APK="app/build/outputs/apk/release/ElectricalCalculationsPro-release.apk"

          if gh release view "$TAG" \
            --repo "${{ github.repository }}" \
            >/dev/null 2>&1; then

            gh release upload \
              "$TAG" \
              "$APK" \
              apk-sha256.txt \
              --repo "${{ github.repository }}" \
              --clobber

          else

            gh release create \
              "$TAG" \
              "$APK" \
              apk-sha256.txt \
              --repo "${{ github.repository }}" \
              --title "Electrical Calculations Pro $TAG" \
              --notes-file release-notes.md

          fi

      - name: Final Verification
        shell: bash
        run: |
          TAG="v1.0.${{ github.run_number }}"

          gh release view \
            "$TAG" \
            --repo "${{ github.repository }}"

          echo ""
          echo "=========================================="
          echo " RELEASE BUILD SUCCESSFUL"
          echo "=========================================="
          echo "Version : 1.0.${{ github.run_number }}"
          echo "Code    : ${{ github.run_number }}"
          echo "Tag     : $TAG"
          echo "APK     : ElectricalCalculationsPro-release.apk"
          echo "=========================================="
