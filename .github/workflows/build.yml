name: Build And Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: electrical-calculations-pro-release
  cancel-in-progress: false

jobs:
  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

          echo "Android SDK verified."

      - name: Verify Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is missing"
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD is missing"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::KEY_ALIAS is missing"
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::KEY_PASSWORD is missing"
            exit 1
          fi

          echo "All signing secrets are present."

      - name: Prepare Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          echo "Preparing permanent release signing..."

          python3 <<'PY'
          import base64
          import os

          value = os.environ["KEYSTORE_BASE64"]

          value = "".join(value.split())

          value += "=" * ((4 - len(value) % 4) % 4)

          try:
              data = base64.b64decode(
                  value,
                  validate=True
              )
          except Exception as exc:
              raise SystemExit(
                  f"Invalid KEYSTORE_BASE64 secret: {exc}"
              )

          if not data:
              raise SystemExit(
                  "KEYSTORE_BASE64 decoded to an empty file"
              )

          with open(
              "release.keystore",
              "wb"
          ) as output:
              output.write(data)

          print(
              f"Keystore decoded successfully: {len(data)} bytes"
          )
          PY

          test -s release.keystore

          python3 <<'PY'
          import base64
          import os

          def encode(value):
              return base64.b64encode(
                  value.encode("utf-8")
              ).decode("ascii")

          with open(
              "ci-signing.properties",
              "w",
              encoding="utf-8"
          ) as output:

              output.write(
                  "storeFile=release.keystore\n"
              )

              output.write(
                  "storePasswordB64="
                  + encode(
                      os.environ["KEYSTORE_PASSWORD"]
                  )
                  + "\n"
              )

              output.write(
                  "keyAliasB64="
                  + encode(
                      os.environ["KEY_ALIAS"]
                  )
                  + "\n"
              )

              output.write(
                  "keyPasswordB64="
                  + encode(
                      os.environ["KEY_PASSWORD"]
                  )
                  + "\n"
              )
          PY

          test -s ci-signing.properties

          echo "Release signing files prepared successfully."

      - name: Inspect Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -e

          echo "Checking keystore format..."

          file release.keystore

          echo ""
          echo "Checking keystore structure..."

          if keytool \
            -list \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            2>keystore-error.log
          then
            echo "Keystore password is VALID."
          else
            echo ""
            echo "=========================================="
            echo "KEYSTORE VALIDATION FAILED"
            echo "=========================================="

            cat keystore-error.log

            echo ""
            echo "The failure is in:"
            echo "- KEYSTORE_PASSWORD"
            echo "or"
            echo "- keystore format"

            exit 1
          fi

      - name: Verify Key Alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -e

          echo "Checking release key alias..."

          echo "Expected alias: $KEY_ALIAS"

          if keytool \
            -list \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            2>alias-error.log
          then

            echo "Release key alias is VALID."

          else

            echo ""
            echo "=========================================="
            echo "KEY ALIAS VALIDATION FAILED"
            echo "=========================================="

            cat alias-error.log

            echo ""
            echo "Available aliases:"

            keytool \
              -list \
              -keystore release.keystore \
              -storepass "$KEYSTORE_PASSWORD"

            exit 1
          fi

      - name: Verify Key Password
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          echo "Checking release key password..."

          if keytool \
            -certreq \
            -alias "$KEY_ALIAS" \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file /tmp/test-request.csr \
            >/dev/null \
            2>key-password-error.log
          then

            echo "Release key password is VALID."

          else

            echo ""
            echo "=========================================="
            echo "KEY PASSWORD VALIDATION FAILED"
            echo "=========================================="

            cat key-password-error.log

            exit 1
          fi

          rm -f /tmp/test-request.csr

      - name: Set Version
        shell: bash
        run: |
          set -e

          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

          echo "Version Code: ${{ github.run_number }}"
          echo "Version Name: 1.0.${{ github.run_number }}"

      - name: Build Release
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        shell: bash
        run: |
          set -e

          gradle \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          echo "APK generated successfully."

          ls -lh "$APK"

      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo "APK signature verified."

      - name: Verify Application ID
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          BADGING=$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
              dump badging \
              "$APK"
          )

          echo "$BADGING"

          echo "$BADGING" \
            | grep \
              "package: name='com.electrical.calculationspro'"

          echo "Application ID verified."

      - name: Verify Version
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          BADGING=$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
              dump badging \
              "$APK"
          )

          echo "$BADGING" \
            | grep \
              "versionCode='${{ github.run_number }}'"

          echo "$BADGING" \
            | grep \
              "versionName='1.0.${{ github.run_number }}'"

          echo "APK version verified."

      - name: Rename APK
        shell: bash
        run: |
          set -e

          SOURCE="app/build/outputs/apk/release/app-release.apk"

          TARGET="app/build/outputs/apk/release/ElectricalCalculationsPro-release.apk"

          cp "$SOURCE" "$TARGET"

          test -f "$TARGET"

          echo "Final APK:"
          ls -lh "$TARGET"

      - name: Calculate SHA256
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/ElectricalCalculationsPro-release.apk"

          sha256sum "$APK" > apk-sha256.txt

          cat apk-sha256.txt

      - name: Create Release Notes
        shell: bash
        run: |
          set -e

          cat > release-notes.md <<EOF
          # Electrical Calculations Pro

          Version: 1.0.${{ github.run_number }}

          Version Code: ${{ github.run_number }}

          Commit: ${{ github.sha }}

          Application ID: com.electrical.calculationspro

          Automatically built and permanently signed.

          ## SHA-256

          $(cat apk-sha256.txt)
          EOF

          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          TAG="v1.0.${{ github.run_number }}"

          APK="app/build/outputs/apk/release/ElectricalCalculationsPro-release.apk"

          echo "Publishing release: $TAG"

          gh release create \
            "$TAG" \
            "$APK" \
            apk-sha256.txt \
            --repo "${{ github.repository }}" \
            --title "Electrical Calculations Pro $TAG" \
            --notes-file release-notes.md

      - name: Verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          TAG="v1.0.${{ github.run_number }}"

          gh release view \
            "$TAG" \
            --repo "${{ github.repository }}"

          echo "GitHub Release verified."

      - name: Final Verification
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/ElectricalCalculationsPro-release.apk"

          test -f "$APK"

          echo ""
          echo "=========================================="
          echo " ELECTRICAL CALCULATIONS PRO"
          echo " RELEASE SUCCESSFUL"
          echo "=========================================="
          echo "Version  : 1.0.${{ github.run_number }}"
          echo "Code     : ${{ github.run_number }}"
          echo "Tag      : v1.0.${{ github.run_number }}"
          echo "Package  : com.electrical.calculationspro"
          echo "APK      : ElectricalCalculationsPro-release.apk"
          echo "=========================================="

      - name: Cleanup Signing Files
        if: always()
        shell: bash
        run: |
          rm -f release.keystore
          rm -f keystore.base64
          rm -f ci-signing.properties
          rm -f keystore-error.log
          rm -f alias-error.log
          rm -f key-password-error.log
          rm -f /tmp/test-request.csr

          echo "Signing files cleaned up."
