name: Build And Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:

  release:
    name: Build Release And Publish
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Verify Gradle
        run: |
          gradle --version

      - name: Verify Release Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "::error::KEYSTORE_BASE64 secret is missing"
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "::error::KEYSTORE_PASSWORD secret is missing"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "::error::KEY_ALIAS secret is missing"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "::error::KEY_PASSWORD secret is missing"
            exit 1
          }

      - name: Build Signed Release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}

          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk || {
            echo "::error::Release APK was not generated"
            exit 1
          }

          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          cp \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/ElectricalCalculationsPro-release.apk

      - name: Verify APK Signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -f "$APKSIGNER" || {
            echo "::error::apksigner was not found"
            exit 1
          }

          "$APKSIGNER" verify \
            --verbose \
            app/build/outputs/apk/release/ElectricalCalculationsPro-release.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          TAG="v1.0.${{ github.run_number }}"
          APK="app/build/outputs/apk/release/ElectricalCalculationsPro-release.apk"

          gh release create \
            "$TAG" \
            "$APK" \
            --repo "${{ github.repository }}" \
            --title "Electrical Calculations Pro $TAG" \
            --generate-notes
