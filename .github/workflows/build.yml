name: Build And Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: electrical-calculations-pro-release
  cancel-in-progress: false

jobs:

  release:

    name: Build Signed Release APK

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Verify Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Prepare Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import base64
          import os

          value = "".join(
              os.environ["KEYSTORE_BASE64"].split()
          )

          value += "=" * (
              (4 - len(value) % 4) % 4
          )

          data = base64.b64decode(
              value,
              validate=True
          )

          if not data:
              raise SystemExit(
                  "Empty keystore"
              )

          with open(
              "release.keystore",
              "wb"
          ) as output:
              output.write(data)

          def encode(value):
              return base64.b64encode(
                  value.encode("utf-8")
              ).decode("ascii")

          with open(
              "ci-signing.properties",
              "w",
              encoding="utf-8"
          ) as output:

              output.write(
                  "storeFile=release.keystore\n"
              )

              output.write(
                  "storePasswordB64=" +
                  encode(
                      os.environ[
                          "KEYSTORE_PASSWORD"
                      ]
                  ) +
                  "\n"
              )

              output.write(
                  "keyAliasB64=" +
                  encode(
                      os.environ["KEY_ALIAS"]
                  ) +
                  "\n"
              )

              output.write(
                  "keyPasswordB64=" +
                  encode(
                      os.environ["KEY_PASSWORD"]
                  ) +
                  "\n"
              )
          PY

          test -s release.keystore
          test -s ci-signing.properties

      - name: Verify Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -e

          keytool \
            -list \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null

      - name: Verify Key Alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -e

          keytool \
            -list \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

      - name: Verify Key Password
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          keytool \
            -certreq \
            -alias "$KEY_ALIAS" \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file /tmp/test-request.csr \
            >/dev/null

          rm -f /tmp/test-request.csr

      - name: Set Version
        shell: bash
        run: |
          set -e

          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build Release
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        shell: bash
        run: |
          set -e

          ./gradlew \
            :app:assembleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME" \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

      - name: Verify Application ID
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          BADGING=$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
              dump badging \
              "$APK"
          )

          echo "$BADGING" |
            grep \
              "package: name='com.electrical.calculationspro'"

      - name: Verify Version
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          BADGING=$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
              dump badging \
              "$APK"
          )

          echo "$BADGING" |
            grep \
              "versionCode='${{ github.run_number }}'"

          echo "$BADGING" |
            grep \
              "versionName='1.0.${{ github.run_number }}'"

      - name: Rename APK
        shell: bash
        run: |
          set -e

          SOURCE="app/build/outputs/apk/release/app-release.apk"

          TARGET="app/build/outputs/apk/release/ElectricalCalculationsPro-release.apk"

          cp "$SOURCE" "$TARGET"

          test -f "$TARGET"

      - name: Calculate SHA256
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/ElectricalCalculationsPro-release.apk"

          sha256sum "$APK" > apk-sha256.txt

          cat apk-sha256.txt

      - name: Create Release Notes
        shell: bash
        run: |
          set -e

          cat > release-notes.md <<EOF
          # Electrical Calculations Pro

          Version: 1.0.${{ github.run_number }}

          Version Code: ${{ github.run_number }}

          Commit: ${{ github.sha }}

          Application ID: com.electrical.calculationspro

          Automatically built and permanently signed.

          ## SHA-256

          $(cat apk-sha256.txt)
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          TAG="v1.0.${{ github.run_number }}"

          APK="app/build/outputs/apk/release/ElectricalCalculationsPro-release.apk"

          gh release create \
            "$TAG" \
            "$APK" \
            apk-sha256.txt \
            --repo "${{ github.repository }}" \
            --title "Electrical Calculations Pro $TAG" \
            --notes-file release-notes.md

      - name: Verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          TAG="v1.0.${{ github.run_number }}"

          gh release view \
            "$TAG" \
            --repo "${{ github.repository }}"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f release.keystore
          rm -f ci-signing.properties
          rm -f /tmp/test-request.csr
