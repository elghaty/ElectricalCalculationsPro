name: Build And Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: electrical-calculations-pro-release
  cancel-in-progress: false

jobs:

  release:

    name: Build Signed Release APK

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Verify Signing Configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |

          failed=0

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is missing"
            failed=1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD is missing"
            failed=1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::KEY_ALIAS is missing"
            failed=1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::KEY_PASSWORD is missing"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "::error::Permanent Android release signing is not configured."
            exit 1
          fi

          echo "Signing configuration detected."

      - name: Set Version
        shell: bash
        run: |

          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build Release
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |

          gradle \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Verify APK Signature
        shell: bash
        run: |

          APK="app/build/outputs/apk/release/app-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

      - name: Verify Application ID
        shell: bash
        run: |

          APK="app/build/outputs/apk/release/app-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$APK" |
            grep \
            "package: name='com.electrical.calculationspro'"

      - name: Rename APK
        shell: bash
        run: |

          cp \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/ElectricalCalculationsPro-release.apk

      - name: Calculate SHA256
        shell: bash
        run: |

          sha256sum \
            app/build/outputs/apk/release/ElectricalCalculationsPro-release.apk \
            > apk-sha256.txt

          cat apk-sha256.txt

      - name: Create Release Notes
        shell: bash
        run: |

          cat > release-notes.md <<EOF
          # Electrical Calculations Pro

          Version: 1.0.${{ github.run_number }}

          Version Code: ${{ github.run_number }}

          Commit:
          ${{ github.sha }}

          This APK was automatically built and permanently signed.

          Application ID:
          com.electrical.calculationspro

          The APK is designed to update an existing installation
          without uninstalling the application.

          ## SHA-256

          $(cat apk-sha256.txt)
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |

          TAG="v1.0.${{ github.run_number }}"

          APK="app/build/outputs/apk/release/ElectricalCalculationsPro-release.apk"

          if gh release view \
            "$TAG" \
            --repo "${{ github.repository }}" \
            >/dev/null 2>&1
          then

            gh release upload \
              "$TAG" \
              "$APK" \
              apk-sha256.txt \
              --repo "${{ github.repository }}" \
              --clobber

          else

            gh release create \
              "$TAG" \
              "$APK" \
              apk-sha256.txt \
              --repo "${{ github.repository }}" \
              --title "Electrical Calculations Pro $TAG" \
              --notes-file release-notes.md

          fi

      - name: Final Verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |

          TAG="v1.0.${{ github.run_number }}"

          gh release view \
            "$TAG" \
            --repo "${{ github.repository }}"

          echo ""
          echo "========================================"
          echo " ELECTRICAL CALCULATIONS PRO"
          echo " RELEASE SUCCESSFUL"
          echo "========================================"
          echo "Version : 1.0.${{ github.run_number }}"
          echo "Code    : ${{ github.run_number }}"
          echo "Tag     : $TAG"
          echo "APK     : ElectricalCalculationsPro-release.apk"
          echo "========================================"
