name: Build And Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: electrical-calculations-pro-release
  cancel-in-progress: false

jobs:
  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

          echo "Android SDK verified."

      - name: Verify Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is missing"
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD is missing"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::KEY_ALIAS is missing"
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::KEY_PASSWORD is missing"
            exit 1
          fi

          echo "All signing secrets are present."

      - name: Prepare Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          echo "Preparing permanent release signing..."

          printf '%s' "$KEYSTORE_BASE64" > keystore.base64

          test -s keystore.base64

          base64 --decode keystore.base64 > release.keystore

          test -s release.keystore

          rm -f keystore.base64

          STORE_PASSWORD_B64="$(printf '%s' "$KEYSTORE_PASSWORD" | base64 -w 0)"
          KEY_ALIAS_B64="$(printf '%s' "$KEY_ALIAS" | base64 -w 0)"
          KEY_PASSWORD_B64="$(printf '%s' "$KEY_PASSWORD" | base64 -w 0)"

          {
            printf '%s\n' "storeFile=release.keystore"
            printf '%s\n' "storePasswordB64=$STORE_PASSWORD_B64"
            printf '%s\n' "keyAliasB64=$KEY_ALIAS_B64"
            printf '%s\n' "keyPasswordB64=$KEY_PASSWORD_B64"
          } > ci-signing.properties

          test -s ci-signing.properties

          echo "Release signing files prepared successfully."

      - name: Verify Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -e

          keytool \
            -list \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Keystore verified successfully."

      - name: Set Version
        shell: bash
        run: |
          set -e

          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

          echo "Version Code: ${{ github.run_number }}"
          echo "Version Name: 1.0.${{ github.run_number }}"

      - name: Build Release
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        shell: bash
        run: |
          set -e

          gradle \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          echo "APK generated successfully."
          ls -lh "$APK"

      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo "APK signature verified."

      - name: Verify Application ID
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          BADGING=$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
              dump badging \
              "$APK"
          )

          echo "$BADGING"

          echo "$BADGING" \
            | grep "package: name='com.electrical.calculationspro'"

          echo "Application ID verified."

      - name: Verify Version
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          BADGING=$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
              dump badging \
              "$APK"
          )

          echo "$BADGING" \
            | grep "versionCode='${{ github.run_number }}'"

          echo "$BADGING" \
            | grep "versionName='1.0.${{ github.run_number }}'"

          echo "APK version verified."

      - name: Rename APK
        shell: bash
        run: |
          set -e

          SOURCE="app/build/outputs/apk/release/app-release.apk"
          TARGET="app/build/outputs/apk/release/ElectricalCalculationsPro-release.apk"

          cp "$SOURCE" "$TARGET"

          test -f "$TARGET"

          echo "Final APK:"
          ls -lh "$TARGET"

      - name: Calculate SHA256
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/ElectricalCalculationsPro-release.apk"

          sha256sum "$APK" > apk-sha256.txt

          cat apk-sha256.txt

      - name: Create Release Notes
        shell: bash
        run: |
          set -e

          cat > release-notes.md <<EOF
          # Electrical Calculations Pro

          Version: 1.0.${{ github.run_number }}

          Version Code: ${{ github.run_number }}

          Commit: ${{ github.sha }}

          Application ID: com.electrical.calculationspro

          Automatically built and permanently signed.

          ## SHA-256

          $(cat apk-sha256.txt)
          EOF

          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          TAG="v1.0.${{ github.run_number }}"
          APK="app/build/outputs/apk/release/ElectricalCalculationsPro-release.apk"

          echo "Publishing release: $TAG"

          gh release create \
            "$TAG" \
            "$APK" \
            apk-sha256.txt \
            --repo "${{ github.repository }}" \
            --title "Electrical Calculations Pro $TAG" \
            --notes-file release-notes.md

      - name: Verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          TAG="v1.0.${{ github.run_number }}"

          gh release view \
            "$TAG" \
            --repo "${{ github.repository }}"

          echo "GitHub Release verified."

      - name: Final Verification
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/ElectricalCalculationsPro-release.apk"

          test -f "$APK"

          echo ""
          echo "=========================================="
          echo " ELECTRICAL CALCULATIONS PRO"
          echo " RELEASE SUCCESSFUL"
          echo "=========================================="
          echo "Version  : 1.0.${{ github.run_number }}"
          echo "Code     : ${{ github.run_number }}"
          echo "Tag      : v1.0.${{ github.run_number }}"
          echo "Package  : com.electrical.calculationspro"
          echo "APK      : ElectricalCalculationsPro-release.apk"
          echo "=========================================="

      - name: Cleanup Signing Files
        if: always()
        shell: bash
        run: |
          rm -f release.keystore
          rm -f keystore.base64
          rm -f ci-signing.properties

          echo "Signing files cleaned up."
