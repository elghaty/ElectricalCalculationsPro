name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build and Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Generate automatic version
        id: version
        shell: bash
        run: |
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"

          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

          echo "Version Code: ${VERSION_CODE}"
          echo "Version Name: ${VERSION_NAME}"

      - name: Build Release APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          ./gradlew assembleRelease \
            -PversionCode="${VERSION_CODE}" \
            -PversionName="${VERSION_NAME}" \
            --no-daemon

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "APK found: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        id: rename
        shell: bash
        run: |
          VERSION_NAME="${{ steps.version.outputs.version_name }}"

          mkdir -p release

          cp "${{ steps.apk.outputs.apk_path }}" \
            "release/ElectricalDesignEngineer-${VERSION_NAME}.apk"

          echo "release_path=release/ElectricalDesignEngineer-${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElectricalDesignEngineer-${{ steps.version.outputs.version_name }}
          path: release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: ElectricalDesignEngineer v${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          files: release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
